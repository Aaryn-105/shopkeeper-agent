[project]
name = "shopkeeper-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "asyncmy>=0.2.11",
    "faiss-cpu>=1.14.3",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "pymysql>=1.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.0",
]